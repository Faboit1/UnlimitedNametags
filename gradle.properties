version = 2.0.2

# Build performance. Independent modules (api, api-paper, common) compile in parallel and task
# outputs are cached, which keeps CI runs and incremental local builds short.
org.gradle.parallel = true
org.gradle.caching = true
# The default 512m daemon heap is tight for shadowJar + javadoc on this project.
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
